name: Update Google Scholar citations

on:
  schedule:
    # Runs shortly after midnight in China Standard Time.
    - cron: "17 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-google-scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch citation count
        run: python3 scripts/update_scholar_citations.py

      - name: Commit updated count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.yml
          if git diff --cached --quiet; then
            echo "Citation count is unchanged."
          else
            git commit -m "Update Google Scholar citation count"
            git push
          fi
